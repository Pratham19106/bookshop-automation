services:
  - type: web
    name: bookshop-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TZ_OFFSET_MINUTES
        value: -330
      - key: SESSION_HOURS
        value: 12
